<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp</title>
<style>
body{margin:0;font-family:Arial;background:#075E54;color:white;text-align:center}
.box{padding-top:120px}
.logo{font-size:70px}
.loader{width:50px;height:50px;border:5px solid white;border-top:5px solid #25D366;border-radius:50%;margin:30px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#prank{display:none;padding-top:100px;background:#ffe6f2;color:#333;height:100vh}
#prank h1{font-size:45px}
button{background:#d63384;color:white;border:none;padding:15px 30px;font-size:20px;border-radius:30px}
</style>
</head>
<body>

<div id="loading" class="box">
<div class="logo">💬</div>
<h2>WhatsApp</h2>
<p>Loading your chats...</p>
<div class="loader"></div>
<p id="count">Please wait... 5</p>
<p style="font-size:12px;opacity:0.7">End-to-end encrypted</p>
</div>

<div id="prank">
<h1>😂 GOTCHA! 😂</h1>
<h2>PRANKED BY NOOR!</h2>
<p>Your WhatsApp is 100% SAFE!<br>Send this to your friend to prank them!</p>
<button onclick="location.reload()">Prank Again 😈</button>
<br><br>
<p>Made by Noor from Lahore ❤️</p>
</div>

<script>
let n=5;
let timer=setInterval(()=>{
n--;
document.getElementById('count').innerText="Please wait... "+n;
if(n<=0){
clearInterval(timer);
document.getElementById('loading').style.display='none';
document.getElementById('prank').style.display='block';
}
},1000);
</script>
</body>
</html>
