<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noor Cricket Game</title>
<style>
body{margin:0;background:#0a5c2e;font-family:Arial;text-align:center;color:white}
h1{margin:5px}
#game{width:95%;max-width:400px;height:500px;background:linear-gradient(#7ec850,#2e9e4f);margin:auto;position:relative;border:4px solid white;border-radius:15px;overflow:hidden}
#pitch{position:absolute;left:45%;top:40px;width:40px;height:400px;background:#d2b48c}
#stumps1{position:absolute;left:48%;top:20px;font-size:30px}
#stumps2{position:absolute;left:48%;bottom:20px;font-size:30px}
#batsman{position:absolute;left:38%;bottom:80px;font-size:55px;transition:0.2s}
#bowler{position:absolute;left:48%;top:60px;font-size:50px}
#ball{position:absolute;left:50%;top:90px;width:22px;height:22px;background:red;border-radius:50%;display:none}
#score{font-size:22px;background:black;padding:8px}
button{padding:15px 30px;font-size:22px;background:yellow;border:none;border-radius:12px;margin:10px;font-weight:bold}
#msg{font-size:28px;color:yellow;height:35px}
</style>
</head>
<body>
<h1>🏏 NOOR CRICKET 🏏</h1>
<div id="score">Score: <span id="runs">0</span> | Wickets: <span id="wk">0</span> | Balls: <span id="balls">0</span>/6</div>
<div id="game">
<div id="pitch"></div>
<div id="stumps1">🏏</div>
<div id="bowler">🤾</div>
<div id="ball"></div>
<div id="batsman">🏏🧍</div>
<div id="stumps2">🏏</div>
</div>
<div id="msg">Tap HIT when ball comes!</div>
<button onclick="bowl()">🎳 BOWL</button>
<button onclick="hit()">🏏 HIT!</button>
<br>
<button onclick="location.reload()">🔄 New Game</button>

<script>
let runs=0, wk=0, balls=0, ballMoving=false, canHit=false;
function bowl(){
if(ballMoving) return;
if(balls>=6){document.getElementById("msg").innerText="Over Finished! New Game!"; return;}
ballMoving=true; canHit=true;
let ball=document.getElementById("ball");
ball.style.display="block";
let top=90;
let go=setInterval(function(){
top+=8;
ball.style.top=top+"px";
if(top>=380){
clearInterval(go);
ball.style.display="none";
ball.style.top="90px";
ballMoving=false;
if(canHit){
wk++; balls++;
document.getElementById("wk").innerText=wk;
document.getElementById("balls").innerText=balls;
document.getElementById("msg").innerText="OUT! 😭 Bowled!";
if(wk>=3) document.getElementById("msg").innerText="Game Over! Score: "+runs;
}
}
},30);
}
function hit(){
if(!ballMoving || !canHit) return;
let ball=document.getElementById("ball");
let top=parseInt(ball.style.top);
if(top>300 && top<390){
canHit=false;
let r=Math.random();
if(r<0.3){runs+=6; document.getElementById("msg").innerText="SIXXXX! 🔥🔥🔥";}
else if(r<0.6){runs+=4; document.getElementById("msg").innerText="FOUR! 👏";}
else if(r<0.85){runs+=1; document.getElementById("msg").innerText="1 Run! Good!";}
else{runs+=2; document.getElementById("msg").innerText="2 Runs!";}
balls++;
document.getElementById("runs").innerText=runs;
document.getElementById("balls").innerText=balls;
document.getElementById("batsman").style.transform="rotate(-30deg)";
setTimeout(()=>{document.getElementById("batsman").style.transform="rotate(0deg)"},300);
} else {
document.getElementById("msg").innerText="Too Early / Late! Wait!";
}
}
</script>
</body>
</html>
